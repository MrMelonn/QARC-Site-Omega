<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QARC Terminal</title>
  <style>
    :root {
      --bg: #0b0f0b;
      --fg: #c8facc;
      --dim: #6baf79;
      --accent: #82ff9e;
      --error: #ff6b6b;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    }
    .frame {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .bezel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--accent);
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .title {
      margin-left: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .screen {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .line { display: block; margin: 2px 0; }
    .muted { color: var(--dim); }
    .error { color: var(--error); }
    .ok { color: var(--accent); }
    .prompt {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 8px;
    }
    .caret {
      display: inline-block;
      width: 8px; height: 1.1em;
      background: var(--accent);
      margin-left: 2px;
      animation: blink 1s steps(2, jump-none) infinite
